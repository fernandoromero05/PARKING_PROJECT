<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CampusPark - Report</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
<header>
  <div><a href="index.html" style="color:white;text-decoration:none;"><b>CampusPark</b></a></div>
  <div id="topUser" class="small"></div>
</header>

<main>
  <div class="card">
    <h3>Report / Complaint</h3>
    <div class="small">Choose a complaint. This affects token points if verified/thresholded.</div>

    <div class="row" style="margin-top:10px;">
      <select id="type">
        <option value="POORLY_PARKED">Poorly parked (-5)</option>
        <option value="DID_NOT_CLAIM">Did not claim (threshold ≥4 ⇒ -15)</option>
        <option value="DISRESPECTFUL_DRIVER">Disrespectful driver</option>
        <option value="EXCEEDS_TIME_LIMIT">Exceeds time limit</option>
        <option value="BLOCKING_SPOT">Blocking another spot</option>
        <option value="PARKED_OVER_LINE">Parked over line</option>
        <option value="UNAUTHORIZED_PARKING">Unauthorized parking</option>
        <option value="ABANDONED_VEHICLE">Abandoned vehicle</option>
        <option value="OTHER">Other</option>
      </select>
      <input id="note" placeholder="Optional note" />
      <button id="sendBtn">Send</button>
      <button id="backBtn" class="secondary">Back</button>
    </div>

    <p class="small" id="msg"></p>
  </div>
</main>

<script type="module">
  import { me } from "./js/auth.js";
  import { fileReport } from "./js/report.js";

  const url = new URL(location.href);
  const spotId = Number(url.searchParams.get("spot_id") || "0");
  const lotId = Number(url.searchParams.get("lot_id") || "0");

  const topUser = document.getElementById("topUser");
  const msg = document.getElementById("msg");

  function setMsg(t){ msg.textContent = t; }

  async function boot() {
    const u = await me();
    topUser.textContent = `Logged in as ${u.user.username} (${u.user.tokens} tokens)`;
  }

  document.getElementById("sendBtn").onclick = async () => {
    setMsg("");
    try {
      const type = document.getElementById("type").value;
      const note = document.getElementById("note").value;
      const res = await fileReport(spotId, type, note);
      setMsg(`Report sent. Target user: ${res.reported_user_id ?? "none"}`);
    } catch (e) {
      setMsg(e.message);
    }
  };

  document.getElementById("backBtn").onclick = () => {
    location.href = `lot.html?lot_id=${encodeURIComponent(lotId)}`;
  };

  boot().catch(() => location.href = "index.html");
</script>
</body>
</html>
