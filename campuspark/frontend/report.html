<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CampusPark - Report</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
<header>
  <div style="display:flex; flex-direction:column;">
    <b>CampusPark</b>
    <div id="topUser" class="small" style="color: rgba(255,255,255,0.8); font-weight:normal;"></div>
  </div>
  <nav>
    <button type="button" onclick="window.location.href='index.html'" class="nav-btn">Home</button>
    <button id="logoutBtnHeader" type="button" style="background: rgba(234, 67, 53, 0.9);">Logout</button>
  </nav>
</header>

<main>
  <div class="card">
    <h3>Report / Complaint</h3>
    <div class="small">Choose a complaint. This affects token points if verified/thresholded.</div>

    <div class="row" style="margin-top:10px;">
      <select id="type">
        <option value="POORLY_PARKED">Poorly parked (-5)</option>
        <option value="DID_NOT_CLAIM">Did not claim (threshold ≥4 ⇒ -15)</option>
        <option value="DISRESPECTFUL_DRIVER">Disrespectful driver</option>
        <option value="EXCEEDS_TIME_LIMIT">Exceeds time limit</option>
        <option value="BLOCKING_SPOT">Blocking another spot</option>
        <option value="PARKED_OVER_LINE">Parked over line</option>
        <option value="UNAUTHORIZED_PARKING">Unauthorized parking</option>
        <option value="ABANDONED_VEHICLE">Abandoned vehicle</option>
        <option value="OTHER">Other</option>
      </select>

      <input id="note" placeholder="Optional note" />

      <!-- 🆕 SOLO ENFORCER -->
      <div id="imageWrap" style="display:none;">
        <input id="image" type="file" accept="image/*" />
      </div>

      <button id="sendBtn">Send</button>
      <button id="backBtn" class="secondary">Back</button>
    </div>

    <p class="small" id="msg"></p>
  </div>
</main>

<script type="module">
  import { me, logout } from "./js/auth.js";
  import { fileReport } from "./js/report.js";

  const url = new URL(location.href);
  const spotId = Number(url.searchParams.get("spot_id") || "0");
  const lotId = Number(url.searchParams.get("lot_id") || "0");

  const topUser = document.getElementById("topUser");
  const msg = document.getElementById("msg");

  function setMsg(t){ msg.textContent = t; }

  async function boot() {
    const u = await me();
    topUser.textContent = `Logged in as ${u.user.username} (${u.user.tokens} tokens)`;

    // 🆕 ENFORCER CHECK
    if (u.user.role === "ENFORCER") {
      document.getElementById("imageWrap").style.display = "block";
    }
  }

  document.getElementById("sendBtn").onclick = async () => {
    setMsg("");
    try {
      const type = document.getElementById("type").value;
      const note = document.getElementById("note").value;
      const image = document.getElementById("image")?.files?.[0];

      let res;

      // =========================
      // 🧠 SAFE MODE (NO BREAK API)
      // =========================
      if (image) {
        try {
          const formData = new FormData();
          formData.append("spot_id", spotId);
          formData.append("type", type);
          formData.append("note", note);
          formData.append("image", image);

          const r = await fetch("/campuspark/backend/api/reports/create.php", {
            method: "POST",
            body: formData,
            credentials: "include"
          });

          const text = await r.text();

          try {
            res = JSON.parse(text);
          } catch (e) {
            console.error("Server returned non-JSON:", text);
            throw new Error("Server error while uploading image");
          }

        } catch (err) {
          console.warn("Image upload failed, fallback to normal report:", err);
          res = await fileReport(spotId, type, note);
        }
      } else {
        // ORIGINAL FLOW (UNCHANGED)
        res = await fileReport(spotId, type, note);
      }

      setMsg(`Report sent. Target user: ${res.reported_user_id ?? "none"}`);
    } catch (e) {
      setMsg(e.message);
    }
  };

  document.getElementById("backBtn").onclick = () => {
    location.href = `lot.html?lot_id=${encodeURIComponent(lotId)}`;
  };

  document.getElementById("logoutBtnHeader").onclick = async () => {
    await logout();
    window.location.href = "login.html";
  };

  boot().catch(() => location.href = "index.html");
</script>
</body>
</html>
