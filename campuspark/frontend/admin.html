<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusPark</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            margin: 2rem auto;
            max-width: 1200px;
        }
        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            color: #2c3e50;
        }
        .stat-banner {
            background: #2c3e50;
            color: white;
            padding: 2rem;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        .tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .tag-penalty { background: #fee2e2; color: #b91c1c; }
        tr[data-report-id] { cursor: pointer; }
        tr[data-report-id]:hover td { background: #f0f4ff; }
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            max-width: 560px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #666;
        }
        .modal h3 { margin: 0 0 1.25rem 0; color: #2c3e50; }
        .detail-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
        }
        .detail-label { font-weight: bold; color: #555; min-width: 130px; }
        .modal-img {
            margin-top: 1rem;
            width: 100%;
            border-radius: 10px;
            border: 1px solid #eee;
        }
        .monthly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .month-tile {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 0.75rem;
            text-align: center;
        }
        .month-tile .month-count {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }
        .month-tile .month-label {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <button type="button" onclick="window.location.href='index.html'" class="nav-btn">View Parking Map</button>
            <button type="button" onclick="window.location.href='admin_users.html'" class="nav-btn">User Management</button>
            <button id="logoutBtn" style="background: rgba(234, 67, 53, 0.9);">Logout</button>
        </nav>
    </header>

    <!-- Report detail modal -->
    <div class="modal-backdrop" id="reportModal">
        <div class="modal">
            <button class="modal-close" id="modalClose" title="Close">&times;</button>
            <h3>Report Detail</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <main>
        <div class="stat-banner">
            <h1>System Health & Report Oversight</h1>
            <p>Total Issues Reported: <span id="totalReports">--</span></p>
            <div style="display:flex; justify-content:center; gap:3rem; margin-top:1rem; flex-wrap:wrap;">
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <span id="statStudents" style="font-size:2rem; font-weight:bold;">--</span>
                    <span style="font-size:0.85rem; opacity:0.85;">Students</span>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <span id="statEnforcers" style="font-size:2rem; font-weight:bold;">--</span>
                    <span style="font-size:0.85rem; opacity:0.85;">Enforcers</span>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <span id="statActiveNow" style="font-size:2rem; font-weight:bold;">--</span>
                    <span style="font-size:0.85rem; opacity:0.85;">Active Now</span>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <span id="statBanned" style="font-size:2rem; font-weight:bold;">--</span>
                    <span style="font-size:0.85rem; opacity:0.85;">Currently Banned</span>
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h2>Top Offenders</h2>
                <table id="offendersTable">
                    <thead><tr><th>User</th><th>Reports</th></tr></thead>
                    <tbody><!-- Dynamic --></tbody>
                </table>
            </div>

            <div class="card">
                <h2>Recent Student Reports</h2>
                <table id="reportsTable">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Reporter</th>
                            <th>Target</th>
                            <th>Note</th>
                            <th>Image</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody><!-- Dynamic --></tbody>
                </table>
            </div>
        </div>

        <div style="max-width:1200px; margin: 0 auto 2rem auto;" class="card">
            <h2>Monthly Reports (last 12 months)</h2>
            <div id="monthlySection">Loading...</div>
        </div>
    </main>

    <script type="module">
        import { apiGet, API_BASE } from './js/api.js';

        async function loadAdminData() {
            try {
                const data = await apiGet('/admin/reports_summary.php');
                const summary = data.summary;

                document.getElementById('totalReports').textContent = summary.total_reports;

                const us = summary.user_stats || {};
                document.getElementById('statStudents').textContent  = us.total_students   ?? '--';
                document.getElementById('statEnforcers').textContent = us.total_enforcers  ?? '--';
                document.getElementById('statActiveNow').textContent = us.active_now       ?? '--';
                document.getElementById('statBanned').textContent    = us.currently_banned ?? '--';

                const offendersTable = document.querySelector('#offendersTable tbody');
                offendersTable.innerHTML = summary.top_offenders.map(o => `
                    <tr><td>${o.username}</td><td><strong>${o.report_count}</strong></td></tr>
                `).join('');

                const reportsTable = document.querySelector('#reportsTable tbody');
                reportsTable.innerHTML = summary.recent_reports.map(r => `
                    <tr data-report-id="${r.id}" title="Click to see full details">
                        <td><span class="tag tag-penalty">${r.type.replace(/_/g, ' ')}</span></td>
                        <td>${r.reporter_name || '-'}</td>
                        <td>${r.reported_name || 'System / N/A'}</td>
                        <td title="${r.note || ''}">${r.note ? r.note.substring(0, 20) + '...' : '-'}</td>
                        <td>${r.image_url ? '📷' : '-'}</td>
                        <td>${new Date(r.created_at).toLocaleString()}</td>
                    </tr>
                `).join('');

                document.querySelectorAll('tr[data-report-id]').forEach(row => {
                    row.addEventListener('click', () => openReportDetail(Number(row.dataset.reportId)));
                });

                const monthly = summary.monthly_breakdown || [];
                const monthlySection = document.getElementById('monthlySection');
                if (monthlySection) {
                    monthlySection.innerHTML = monthly.length === 0
                        ? '<p style="color:#666;">No data yet.</p>'
                        : `<div class="monthly-grid">${monthly.map(m => `
                            <div class="month-tile">
                                <div class="month-count">${m.total}</div>
                                <div class="month-label">${m.month}</div>
                            </div>`).join('')}</div>`;
                }

            } catch (err) {
                console.error(err);
                alert("Access Denied: You must be an administrator to view this page.");
                window.location.href = 'index.html';
            }
        }

        async function openReportDetail(id) {
            const modal   = document.getElementById('reportModal');
            const body    = document.getElementById('modalBody');
            body.innerHTML = '<p style="color:#666;">Loading...</p>';
            modal.classList.add('open');

            try {
                const data = await apiGet(`/admin/report_detail.php?id=${id}`);
                const r    = data.report;

                const row = (label, value) =>
                    `<div class="detail-row"><span class="detail-label">${label}</span><span>${value}</span></div>`;

                body.innerHTML = `
                    ${row('Report ID', '#' + r.id)}
                    ${row('Type', `<span class="tag tag-penalty">${r.type.replace(/_/g, ' ')}</span>`)}
                    ${row('Lot / Spot', `${r.lot_name} — Spot #${r.spot_number} (${r.spot_type})`)}
                    ${row('Filed by', `${r.reporter_name} <em style="color:#888;">(${r.reporter_role})</em>`)}
                    ${r.enforcer_name ? row('Evidence by', `${r.enforcer_name} <em style="color:#888;">(Enforcer)</em>`) : ''}
                    ${row('Reported User', r.reported_name
                        ? `${r.reported_name} &nbsp;|&nbsp; ${r.reported_tokens} tokens &nbsp;|&nbsp; Rating ${r.reported_rating}${r.reported_is_banned ? ' &nbsp;<span style="color:#b91c1c;font-weight:bold;">BANNED</span>' : ''}`
                        : '<em style="color:#888;">None</em>')}
                    ${row('Note', r.note || '<em style="color:#888;">—</em>')}
                    ${row('Filed at', new Date(r.created_at).toLocaleString())}
                    ${r.image_url
                        ? `<p style="font-weight:bold;margin:1rem 0 0.25rem 0;">Evidence photo</p>
                           <img src="${r.image_url}" alt="Report image" class="modal-img">`
                        : row('Image', '<em style="color:#888;">No image attached</em>')}
                `;
            } catch (err) {
                body.innerHTML = `<p style="color:#b91c1c;">Failed to load: ${err.message}</p>`;
            }
        }

        const modal = document.getElementById('reportModal');
        document.getElementById('modalClose').onclick = () => modal.classList.remove('open');
        modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

        document.getElementById('logoutBtn').onclick = async () => {
            await fetch(`${API_BASE}/auth/logout.php`, { credentials: "include" });
            window.location.href = 'login.html';
        };

        loadAdminData();
    </script>
</body>
</html>
