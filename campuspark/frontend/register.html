<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - CampusPark</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
<header>
  <div><b>CampusPark</b></div>
</header>

<main>
  <div class="auth-container" style="max-width: 500px;">
    <div class="card">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p class="small">Join the CampusPark community</p>
      </div>

      <div id="authMsg" class="error-msg hidden"></div>

      <div class="form-group">
        <label for="regUser">Username</label>
        <input id="regUser" placeholder="e.g. john_doe" />
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input id="regEmail" placeholder="john@example.com" type="email" />
      </div>

      <div class="form-group">
        <label for="regPass">Password (min. 6 characters)</label>
        <input id="regPass" placeholder="••••••••" type="password" />
      </div>

      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;" />
      
      <div class="auth-header" style="margin-bottom: 16px;">
        <h3>Vehicle Information</h3>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="regPlate">License Plate</label>
          <input id="regPlate" placeholder="1234ABC" />
        </div>
        <div class="form-group">
          <label for="regMake">Make / Model</label>
          <input id="regMake" placeholder="Toyota Corolla" />
        </div>
      </div>

      <div class="form-group">
        <label>Vehicle Type</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="regVehicleType" value="ELECTRIC" checked />
            Electric
          </label>
          <label class="radio-option">
            <input type="radio" name="regVehicleType" value="HYBRID" />
            Hybrid
          </label>
          <label class="radio-option">
            <input type="radio" name="regVehicleType" value="DIESEL_GAS" />
            Diesel/Gas
          </label>
        </div>
      </div>

      <button id="regBtn" style="width: 100%; margin-top: 20px;">Register</button>

      <div class="text-center mt-4">
        <p class="small">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { register, me } from "./js/auth.js";

  const authMsg = document.getElementById("authMsg");
  const regBtn = document.getElementById("regBtn");

  async function checkSession() {
    try {
      await me();
      window.location.href = "index.html";
    } catch (e) {
      // Not logged in
    }
  }

  regBtn.onclick = async () => {
    const username = document.getElementById("regUser").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPass").value;
    const vehicle_plate = document.getElementById("regPlate").value.trim();
    const vehicle_make = document.getElementById("regMake").value.trim();
    const vehicle_type = document.querySelector('input[name="regVehicleType"]:checked')?.value;

    console.log("Register button clicked. Values:", {
      username, email, password, vehicle_plate, vehicle_make, vehicle_type
    });

    if (!username || !email || !password || !vehicle_plate || !vehicle_make) {
      authMsg.textContent = "All fields are required.";
      authMsg.classList.remove("hidden");
      return;
    }

    if (password.length < 6) {
      authMsg.textContent = "Password must be at least 6 characters long.";
      authMsg.classList.remove("hidden");
      return;
    }

    authMsg.classList.add("hidden");
    regBtn.disabled = true;
    regBtn.textContent = "Creating account...";

    try {
      await register(username, email, password, vehicle_plate, vehicle_make, vehicle_type);
      window.location.href = "index.html";
    } catch (e) {
      console.error("Registration error:", e);
      authMsg.textContent = e.message;
      authMsg.classList.remove("hidden");
      regBtn.disabled = false;
      regBtn.textContent = "Register";
    }
  };

  checkSession();
</script>
</body>
</html>
