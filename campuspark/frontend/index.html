<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusPark - Dashboard</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
<header>
  <div style="display:flex; flex-direction:column;">
    <b>CampusPark</b>
    <div id="topUser" class="small" style="color: rgba(255,255,255,0.8); font-weight:normal;"></div>
  </div>
  <nav id="adminNav">
    <!-- Admin button injected via JS -->
  </nav>
</header>

<main>
  <div id="loading" class="text-center mt-4">
    <p>Loading session...</p>
  </div>

  <div class="card hidden" id="appCard">
    <div class="row" style="align-items:center;justify-content:space-between; margin-bottom: 20px;">
      <div>
        <h2 style="margin:0;">Select a Parking Lot</h2>
        <div class="small">Choose a lot to view the map and available spots.</div>
        <div class="small mt-4" id="vehicleSummary" style="background: #e8f0fe; padding: 10px; border-radius: 8px; font-weight: 500;"></div>
      </div>
      <div class="row" style="flex: 0;">
        <button id="profileBtn" class="secondary">Profile</button>
        <button id="logoutBtn" style="background: #ea4335;">Logout</button>
      </div>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;" />

    <div class="form-group">
      <label for="lotSelect">Available Parking:</label>
      <div class="row">
        <select id="lotSelect" style="flex: 3;"></select>
        <button id="openLotBtn" style="flex: 1;">Open Map</button>
      </div>
    </div>

    <div id="indexMsg" class="error-msg hidden" style="margin-top: 20px;"></div>
  </div>
</main>

<script type="module">
  import { me, logout } from "./js/auth.js?v=6";
  import { apiGet } from "./js/api.js?v=6";

  const appCard = document.getElementById("appCard");
  const loading = document.getElementById("loading");
  const indexMsg = document.getElementById("indexMsg");
  const topUser = document.getElementById("topUser");
  const vehicleSummary = document.getElementById("vehicleSummary");

  function renderVehicleSummary(user) {
    if (!user.vehicle_plate || !user.vehicle_make || !user.vehicle_type) {
      vehicleSummary.textContent = "Vehicle: Not assigned.";
      return;
    }
    const typeMap = {
      'ELECTRIC': 'Electric',
      'HYBRID': 'Hybrid',
      'DIESEL_GAS': 'Diesel/Gas'
    };
    vehicleSummary.textContent = `Your Vehicle: ${user.vehicle_plate} • ${user.vehicle_make} • ${typeMap[user.vehicle_type] || user.vehicle_type}`;
  }

  async function loadLots() {
    try {
      const data = await apiGet("/lots/list.php");
      const sel = document.getElementById("lotSelect");
      sel.innerHTML = "";
      data.lots.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l.id;
        opt.textContent = `${l.name} (${l.code})`;
        sel.appendChild(opt);
      });
    } catch (e) {
      console.error("Error loading lots:", e);
    }
  }

  async function boot() {
    try {
      const u = await me();
      
      // Inject Admin Panel button ONLY if user is ADMIN
      if (u.user && u.user.role === 'ADMIN') {
        const nav = document.getElementById("adminNav");
        if (nav) {
          nav.innerHTML = `<button type="button" onclick="window.location.href='admin.html'" class="nav-btn" style="background: #fbbc04 !important; color: #333 !important;">Admin Panel</button>`;
        }
      }

      if (topUser) {
        topUser.textContent = `Hello, ${u.user.username} (${u.user.tokens} tokens)`;
      }

      loading.classList.add("hidden");
      appCard.classList.remove("hidden");
      await loadLots();
      renderVehicleSummary(u.user);
    } catch (e) {
      console.error("Boot error:", e);
      window.location.href = "login.html";
    }
  }

  document.getElementById("logoutBtn").onclick = async () => {
    await logout();
    window.location.href = "login.html";
  };

  document.getElementById("openLotBtn").onclick = async () => {
    indexMsg.classList.add("hidden");
    try {
      const lotId = document.getElementById("lotSelect").value;
      if (!lotId) return;
      location.href = `lot.html?lot_id=${encodeURIComponent(lotId)}`;
    } catch (e) {
      indexMsg.textContent = e.message;
      indexMsg.classList.remove("hidden");
    }
  };

  document.getElementById("profileBtn").onclick = () => {
    location.href = "profile.html";
  };

  // Proactive ban check every 5 seconds
  setInterval(async () => {
    try {
      // Use a raw fetch with a timestamp to bypass ALL caching
      const res = await fetch(`/campuspark/backend/api/auth/me.php?cb=${Date.now()}`, { credentials: "include" });
      if (res.status === 403) {
        // Trigger the signal directly
        const data = await res.json().catch(() => ({}));
        // We import api.js globally to access this, or we just use me() since it's imported
        await me(); 
      }
    } catch (e) {}
  }, 5000);

  boot();
</script>
</body>
</html>
